[tool.poetry]
name = "databricks-sql-cli"
version = "0.4.0"
description = "A DBCLI client for Databricks SQL"
authors = ["Databricks SQL CLI Maintainers <dbsqlcli-maintainers@databricks.com>"]
packages = [{include = "dbsqlcli"}]
readme = "README.md"
license = "proprietary"

[tool.poetry.dependencies]
# databricks-sql-connector >=4 requires python >=3.9
python = ">=3.9,<4.0"
Pygments = "^2.11.2"
prompt-toolkit = "^3.0.29"
sqlparse = "^0.4.2"
configobj = "^5.0.6"
cli-helpers = "^2.2.1"
# The old ==2.5.2 pin (urllib3/pyopenssl workaround, see upstream #49) raised
# stale-session and close errors as bare DatabaseError, which bypassed both the
# reconnect retry in sqlexecute.run() and Connection.__del__'s error handling.
# Connector >=4 raises RequestError (an OperationalError), so both work again.
databricks-sql-connector = {version = ">=4.3", extras = ["pyarrow"]}
click = "^8.1.2"

[tool.poetry.scripts]
dbsqlcli = "dbsqlcli.main:cli"
databricks-sql-cli = "dbsqlcli.main:cli"

[tool.poetry.dev-dependencies]
pytest = "^7.1.2"
black = "^22.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
